# Watchgrid behind nginx with HTTPS.
#
# Watchgrid itself keeps serving plain HTTP (default :8090); nginx terminates
# TLS. In watchgrid.env set:
#   WATCHGRID_SECURE_COOKIES=1              # session cookie only over HTTPS
#   WATCHGRID_TRUSTED_PROXIES=127.0.0.1     # nginx's address as Watchgrid sees it
#   WATCHGRID_BIND=127.0.0.1:8090           # optional, nginx on the same host:
#                                           # no plain-HTTP access from the LAN
# and restart Watchgrid. Without TRUSTED_PROXIES every sign-in seems to come
# from nginx: one person's wrong passwords would lock everybody out.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream watchgrid {
    server 127.0.0.1:8090;   # or the NAS address if nginx runs elsewhere
    keepalive 16;
}

server {
    listen 80;
    server_name nvr.example.home;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nvr.example.home;

    ssl_certificate     /etc/nginx/certs/nvr.example.home.crt;
    ssl_certificate_key /etc/nginx/certs/nvr.example.home.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only JSON goes up; clips only come down.
    client_max_body_size 2m;

    location / {
        proxy_pass http://watchgrid;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live video and UI updates are WebSockets (/api/v1/ws,
        # /api/v1/cameras/<id>/live).
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # WebSockets stay open for hours; clips stream as they are read.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
        proxy_request_buffering off;
    }
}
