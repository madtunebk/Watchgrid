# Watchgrid behind Synology DSM's own nginx (ports 80/443 belong to DSM, so
# no separate nginx). Install:
#   sudo cp watchgrid-dsm.conf /etc/nginx/sites-enabled/watchgrid.conf
#   sudo nginx -t && sudo systemctl reload nginx
# and in ~/watchgrid/watchgrid.env:
#   WATCHGRID_TRUSTED_PROXIES=127.0.0.1
# then `sudo sh ~/watchgrid/setup.sh`. Local DNS: nvr.example.home → the NAS.
# Re-check after big DSM updates that the file is still there.

map $http_upgrade $watchgrid_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name nvr.example.home;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nvr.example.home;

    # The DSM default certificate (Control Panel → Security → Certificate).
    ssl_certificate     /usr/syno/etc/certificate/system/default/fullchain.pem;
    ssl_certificate_key /usr/syno/etc/certificate/system/default/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Only JSON goes up; clips only come down.
    client_max_body_size 2m;

    location / {
        # Watchgrid runs with host networking on this NAS.
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live video and UI updates are WebSockets.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $watchgrid_connection;
        # WebSockets stay open for hours; clips stream as they are read.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering     off;
        proxy_request_buffering off;
    }
}
